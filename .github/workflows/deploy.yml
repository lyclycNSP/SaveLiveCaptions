name: Build and Release
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller flake8 mypy types-aiofiles

      - name: Check source and run tests
        run: |
          python -m flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m mypy src/ --explicit-package-bases --ignore-missing-imports
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build portable executable
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Calculate SHA-256
        shell: pwsh
        run: |
          $digest = (Get-FileHash -LiteralPath dist/SaveLiveCaptions.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  SaveLiveCaptions.exe" | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: SaveLiveCaptions
          path: |
            dist/SaveLiveCaptions.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SaveLiveCaptions.exe
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          name: Save Live Captions ${{ github.ref_name }}
          body: |
            单文件便携版：下载 SaveLiveCaptions.exe 后直接运行，无需安装 Python 或安装程序。
            启动时自动检测并打开 Windows 实时字幕。使用说明见仓库中文 README。
          generate_release_notes: true
          draft: false
          prerelease: false
